<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 80vh;
            min-height: 450px;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.35);
        }

        .chat-header {
            background: #2563eb;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f3f6fb;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        #messageInput:focus {
            border-color: #2563eb;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .chat-footer {
            padding: 10px;
            text-align: center;
            background: white;
            color: #64748b;
            font-size: 11px;
        }

        @media (max-width: 500px) {
            .chat-container {
                height: 90vh;
            }

            .chat-header h1 {
                font-size: 20px;
            }

            .bubble {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <header class="chat-header">
            <h1>🤖 TechNova AI Chatbot</h1>
            <p>Your friendly rule-based assistant</p>
        </header>

        <main class="chat-messages" id="chatMessages" aria-live="polite">
            <div class="message bot">
                <div class="bubble">
                    Hello! 👋 Welcome to TechNova Chatbot.
                    Ask me about Python, AI, studying, college, or more!
                </div>
            </div>
        </main>

        <form class="chat-input-area" id="chatForm">
            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
                aria-label="Your message"
                required
            >
            <button type="submit" id="sendButton">Send</button>
        </form>

        <footer class="chat-footer">
            TechNova Internship Project · Rule-Based Chatbot
        </footer>

    </div>

    <script>
        const chatForm = document.getElementById("chatForm");
        const messageInput = document.getElementById("messageInput");
        const chatMessages = document.getElementById("chatMessages");
        const sendButton = document.getElementById("sendButton");

        function addMessage(text, sender) {
            const message = document.createElement("div");
            message.className = `message ${sender}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";

            // Display text safely rather than interpreting it as HTML.
            bubble.textContent = text;

            message.appendChild(bubble);
            chatMessages.appendChild(message);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            addMessage(message, "user");
            messageInput.value = "";
            sendButton.disabled = true;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.reply || "Unable to process the message.");
                }

                addMessage(data.reply, "bot");

            } catch (error) {
                addMessage(
                    "Sorry, I couldn't connect to the server. Please try again.",
                    "bot"
                );
                console.error(error);

            } finally {
                sendButton.disabled = false;
                messageInput.focus();
            }
        });

        messageInput.focus();
    </script>

</body>
</html>
